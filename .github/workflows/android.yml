name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build and inspect installable development APK
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          BUILD_VERSION_CODE: ${{ github.run_number }}
        run: bash scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ar-dogy-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ar-dogy-${{ github.sha }}
          path: dist
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          info = json.load(open('build-info.json'))
          assert info['commit'] == os.environ['RELEASE_COMMIT']
          assert info['tag'] == os.environ['RELEASE_TAG']
          with open('release-notes.md', 'w') as f:
              f.write(f"Development APK built from `{info['commit']}`.\n\n")
              f.write('Signed with the public repository development key. This is a development prerelease, not a production-signed app. Only install APKs from this repository’s trusted releases.\n\n')
              f.write('Requires an ARCore-supported Android device, Android 7.0/API 24 or later, and Google Play Services for AR. Camera and physical floor scanning are required. Real-device AR acceptance is recorded separately; a successful build does not establish hardware behavior.\n\n')
              f.write(f"Version: `{info['versionName']}` (code `{info['versionCode']}`). Verify the APK using `SHA256SUMS.txt`; build and signing details are in `build-info.json` and `apk-inspection.txt`.\n")
          PY
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_COMMIT" \
            --title "AR Dogy $RELEASE_TAG — development APK" --prerelease \
            --notes-file release-notes.md ./*.apk SHA256SUMS.txt build-info.json apk-inspection.txt
